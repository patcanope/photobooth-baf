<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Photobooth Bienvenue à la ferme</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a1a;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #stage {
      position: relative;
      height: 82vh;
      aspect-ratio: 9 / 16;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #countdown {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8rem;
      font-weight: 800;
      text-shadow: 0 4px 20px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    #controls {
      margin-top: 16px;
      display: flex;
      gap: 16px;
    }
    button {
      background: #e30613;
      color: white;
      border: none;
      padding: 16px 32px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(227, 6, 19, 0.4);
    }
    button:disabled { background: #555; box-shadow: none; }
    #btn-reset { background: #2e7d32; display: none; }
    #status {
      position: absolute;
      bottom: 12px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.95rem;
      background: rgba(0,0,0,0.65);
      padding: 8px;
    }
  </style>
</head>
<body>

  <div id="stage">
    <canvas id="output" width="1080" height="1920"></canvas>
    <div id="countdown"></div>
    <div id="status">Chargement de la caméra et de la détection...</div>
  </div>

  <div id="controls">
    <button id="btn-snap" disabled>📸 Prendre la photo</button>
    <button id="btn-reset">🔄 Recommencer</button>
  </div>

  <video id="webcam" autoplay playsinline style="display:none;"></video>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    // ==========================================
    // COORDONNÉES CALIBRÉES POUR TON VISUEL
    // ==========================================
    const CONFIG = {
      holeCenterX: 432,     // Centre horizontal du cercle rouge
      holeCenterY: 792,     // Centre vertical du cercle rouge
      holeDiameter: 255,    // Diamètre intérieur du cercle rouge
      faceScaleFactor: 1.25 // Zoom du visage pour bien remplir l'ouverture
    };

    const video = document.getElementById("webcam");
    const canvas = document.getElementById("output");
    const ctx = canvas.getContext("2d");
    const btnSnap = document.getElementById("btn-snap");
    const btnReset = document.getElementById("btn-reset");
    const countdownEl = document.getElementById("countdown");
    const statusEl = document.getElementById("status");

    const costumeImg = new Image();
    costumeImg.src = "costume.png";

    let faceLandmarker;
    let isFrozen = false;
    let lastVideoTime = -1;

    // Lissage des mouvements pour éviter les tremblements
    let smoothFace = { x: 0, y: 0, width: 0, angle: 0, detected: false };

    async function init() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numFaces: 1
      });

      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      video.srcObject = stream;
      video.addEventListener("loadeddata", () => {
        statusEl.textContent = "Placez votre visage face à la caméra";
        btnSnap.disabled = false;
        renderLoop();
      });
    }

    function renderLoop() {
      if (!isFrozen) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Détection faciale en temps réel
        if (video.currentTime !== lastVideoTime) {
          lastVideoTime = video.currentTime;
          const results = faceLandmarker.detectForVideo(video, performance.now());

          if (results.faceLandmarks && results.faceLandmarks.length > 0) {
            const lm = results.faceLandmarks[0];
            // Points clés : joue gauche (234), joue droite (454), haut front (10), menton (152)
            const left = lm[234];
            const right = lm[454];
            const top = lm[10];
            const bottom = lm[152];

            const centerX = ((left.x + right.x) / 2) * video.videoWidth;
            const centerY = ((top.y + bottom.y) / 2) * video.videoHeight;
            const faceW = Math.hypot((right.x - left.x) * video.videoWidth, (right.y - left.y) * video.videoHeight);
            const angle = Math.atan2((right.y - left.y) * video.videoHeight, (right.x - left.x) * video.videoWidth);

            // Lissage (lerp)
            const alpha = 0.35;
            if (!smoothFace.detected) {
              smoothFace = { x: centerX, y: centerY, width: faceW, angle: angle, detected: true };
            } else {
              smoothFace.x += (centerX - smoothFace.x) * alpha;
              smoothFace.y += (centerY - smoothFace.y) * alpha;
              smoothFace.width += (faceW - smoothFace.width) * alpha;
              smoothFace.angle += (angle - smoothFace.angle) * alpha;
            }
            statusEl.style.display = "none";
          } else {
            smoothFace.detected = false;
            statusEl.style.display = "block";
            statusEl.textContent = "Approchez-vous pour détecter votre visage";
          }
        }

        // 1. Dessiner le visage découpé et aligné dans le trou de la fleur
        if (smoothFace.detected) {
          ctx.save();
          // Masque circulaire légèrement plus large que le trou (x1.15) pour passer sous le rebord rouge
          ctx.beginPath();
          ctx.arc(CONFIG.holeCenterX, CONFIG.holeCenterY, (CONFIG.holeDiameter / 2) * 1.15, 0, Math.PI * 2);
          ctx.clip();

          // Positionnement et mise à l'échelle
          const scale = (CONFIG.holeDiameter * CONFIG.faceScaleFactor) / smoothFace.width;
          ctx.translate(CONFIG.holeCenterX, CONFIG.holeCenterY);
          // Effet miroir horizontal pour le confort de l'utilisateur
          ctx.scale(-scale, scale);
          ctx.rotate(smoothFace.angle);
          ctx.drawImage(video, -smoothFace.x, -smoothFace.y);
          ctx.restore();
        }

        // 2. Dessiner le costume par-dessus
        if (costumeImg.complete) {
          ctx.drawImage(costumeImg, 0, 0, canvas.width, canvas.height);
        }
      }
      requestAnimationFrame(renderLoop);
    }

    // Gestion du déclenchement avec compte à rebours
    btnSnap.addEventListener("click", () => {
      btnSnap.disabled = true;
      let count = 3;
      countdownEl.textContent = count;

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          countdownEl.textContent = count;
        } else {
          clearInterval(timer);
          countdownEl.textContent = "";
          isFrozen = true; // Fige l'image sur le canvas
          btnSnap.style.display = "none";
          btnReset.style.display = "inline-block";
          statusEl.style.display = "block";
          statusEl.textContent = "📸 Prenez l'écran en photo avec votre téléphone !";
        }
      }, 1000);
    });

    btnReset.addEventListener("click", () => {
      isFrozen = false;
      btnSnap.disabled = false;
      btnSnap.style.display = "inline-block";
      btnReset.style.display = "none";
      statusEl.style.display = "none";
    });

    init();
  </script>
</body>
</html>
